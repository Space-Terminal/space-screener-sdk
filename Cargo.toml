[workspace]
resolver = "3"
members = ["crates/space-screener", "crates/st"]
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/EvgeniiKobelev/space-screener-sdk"

[workspace.dependencies]
space-screener = { path = "crates/space-screener" }
extism-pdk = { version = "1.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query"] }
base64 = "0.22"
wasmparser = "0.245"
notify = "8"
dirs = "6"
semver = "1"
wat = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
