[workspace]
resolver = "3"
members = [
    "crates/space-screener",
    "crates/space-screener-check",
    "crates/space-screener-harness",
    "crates/st",
]
exclude = ["examples"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Space-Terminal/space-screener-sdk"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
space-screener = { path = "crates/space-screener" }
space-screener-check = { path = "crates/space-screener-check" }
space-screener-harness = { path = "crates/space-screener-harness" }
extism-pdk = { version = "1.4.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
rust_decimal = { version = "1.41", default-features = false, features = ["serde", "std"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
base64 = "0.22"
wasmparser = "0.245"
notify = "8"
dirs = "6"
semver = "1"
wat = "1"
extism = { version = "1.30.0", default-features = false }
# extism 1.30 with default-features = false does not build without wasmtime's `anyhow`
# feature (extism#903, fix not released); the dependency exists only for that.
wasmtime = { version = "43", default-features = false, features = ["anyhow"] }
cpu-time = "1.0"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
