abi: 1
id: space.top-movers
version: 0.1.1
name: {ru: "Топ движений за 5 минут", en: "Top 5 minute movers"}
description:
  ru: "Самые сильные изменения цены за 5 минут на всех подключённых биржах. Пока копится история за 5 минут, наверху — самые сильные изменения за сутки"
  en: "Biggest 5 minute price moves on all connected exchanges. While the 5 minute history is collecting, the biggest 24h moves come first"
lang: rust
categories: [movers]
source: https://github.com/Space-Terminal/space-screener-sdk/tree/main/examples/top-movers
min_terminal: 0.104.70
http: []
timer_ms: 5000
limits: {cpu_ms_per_call: 500}
columns:
  - {key: symbol, type: symbol, title: {ru: "Тикер", en: "Symbol"}}
  - {key: exchange, type: exchange, title: {ru: "Биржа", en: "Exchange"}}
  - {key: chg5, type: percent, title: {ru: "5м", en: "5m"}, sort: desc}
  - {key: chg24, type: percent, title: {ru: "24ч", en: "24h"}}
  - {key: volume, type: usd, title: {ru: "Объём 24ч", en: "24h volume"}}
  - {key: last, type: price, title: {ru: "Цена", en: "Last"}}
params:
  - {key: market, type: select, title: {ru: "Рынок", en: "Market"}, default: futures, options: [futures, spot]}
  - {key: min_volume, type: number, title: {ru: "Мин. объём, $", en: "Min volume, $"}, default: 5000000, min: 0}
  - {key: limit, type: integer, title: {ru: "Строк", en: "Rows"}, default: 100, min: 1, max: 1000}
